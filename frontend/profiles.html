<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F5F2">
<title>Okur · Kim okuyor?</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Okur">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/profiles.css">
<script type="module" src="/js/profiles.js"></script>
</head>
<body>
<main class="profiles">
  <div class="brand-big">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
    <span>Okur</span>
  </div>
  <h1 id="title">Kim okuyor?</h1>
  <p class="lead">Kitaplık herkes için ortak. Kaldığın yer, kelimelerin ve desten sadece senin profilinde.</p>

  <ul class="profile-grid" id="profile-grid" aria-labelledby="title"></ul>

  <button type="button" class="btn btn-ghost" id="manage" aria-pressed="false">Profilleri yönet</button>
</main>

<dialog id="profile-dialog">
  <form method="dialog" id="profile-form">
    <h2 id="dialog-title">Yeni profil</h2>
    <label class="field">İsim
      <input name="name" required maxlength="40" autocomplete="off">
    </label>
    <fieldset class="colors">
      <legend>Renk</legend>
      <div class="swatches" id="swatches"></div>
    </fieldset>
    <p class="form-error" id="form-error" role="alert" hidden></p>
    <div class="actions">
      <button type="button" class="btn btn-ghost" data-close>Vazgeç</button>
      <button class="btn btn-primary" value="save">Kaydet</button>
    </div>
  </form>
</dialog>

<dialog id="delete-dialog">
  <form method="dialog">
    <h2>Profil silinsin mi?</h2>
    <p class="delete-text"></p>
    <div class="actions">
      <button type="button" class="btn btn-ghost" data-close>Vazgeç</button>
      <button class="btn btn-danger" value="delete">Sil</button>
    </div>
  </form>
</dialog>
</body>
</html>
