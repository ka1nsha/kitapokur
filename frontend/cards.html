<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>Okur · Kartlar</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Okur">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/study.css">
<link rel="stylesheet" href="/css/cards.css">
<script type="module" src="/js/cards.js"></script>
</head>
<body>
<header class="topbar">
  <div class="study-bar">
    <div class="study-bar-left">
      <a class="back" href="/">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Kütüphane</span>
      </a>
      <h1>Kartlar</h1>
    </div>
    <div class="bar-actions">
      <a class="btn btn-ghost" href="/study.html">Çalış</a>
      <button type="button" class="btn btn-primary" id="add-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        <span>Kart ekle</span>
      </button>
    </div>
  </div>
</header>

<main class="cards-page">
  <div class="toolbar">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="visually-hidden">Kartlarda ara</span>
      <input type="search" id="search" placeholder="Kelime ya da anlam ara" autocomplete="off" spellcheck="false">
    </label>
    <label class="select-label">Deste
      <select id="deck-select"><option value="">Tüm kitaplar</option></select>
    </label>
    <label class="select-label">Sırala
      <select id="sort-select">
        <option value="due">Tekrar zamanı</option>
        <option value="added">Son eklenen</option>
        <option value="alpha">A–Z</option>
        <option value="lapses">En çok unutulan</option>
      </select>
    </label>
  </div>

  <div class="filters" role="group" aria-label="Kart durumu">
    <button type="button" data-filter="all" aria-pressed="true">Tümü <span></span></button>
    <button type="button" data-filter="due" aria-pressed="false">Zamanı gelen <span></span></button>
    <button type="button" data-filter="new" aria-pressed="false">Yeni <span></span></button>
    <button type="button" data-filter="learning" aria-pressed="false">Öğreniyor <span></span></button>
    <button type="button" data-filter="review" aria-pressed="false">Tekrar <span></span></button>
    <button type="button" data-filter="suspended" aria-pressed="false">Askıda <span></span></button>
  </div>

  <ul class="card-list" id="card-list" aria-busy="true"></ul>
  <button type="button" class="btn btn-ghost more" id="more" hidden>Daha fazla göster</button>
</main>

<dialog id="add-dialog">
  <form method="dialog">
    <h2>Kart ekle</h2>
    <p>Kitapta geçmeyen bir kelimeyi ya da kalıbı ("give up") desteye ekle.</p>
    <label class="field">İngilizce kelime ya da kalıp
      <input name="word" required maxlength="60" autocomplete="off" autocapitalize="none" spellcheck="false" lang="en">
    </label>
    <label class="field">Türkçe anlamı
      <input name="translation" maxlength="200" autocomplete="off">
      <span class="hint">Boş bırakırsan otomatik çevrilir.</span>
    </label>
    <label class="field">Örnek cümle
      <textarea name="sentence" maxlength="500" rows="2" lang="en" spellcheck="false"></textarea>
      <span class="hint">İsteğe bağlı; boşluk doldurma alıştırmasında kullanılır.</span>
    </label>
    <label class="field">Not
      <textarea name="note" maxlength="500" rows="2"></textarea>
    </label>
    <p class="form-error" role="alert" hidden></p>
    <div class="actions">
      <button type="button" class="btn btn-ghost" data-close>Vazgeç</button>
      <button class="btn btn-primary" value="save">Ekle</button>
    </div>
  </form>
</dialog>

<dialog id="edit-dialog">
  <form method="dialog">
    <div class="edit-head">
      <h2 lang="en"></h2>
      <span class="chip"></span>
    </div>
    <p class="edit-meta"></p>
    <label class="field">Türkçe anlamı
      <input name="translation" maxlength="200" autocomplete="off">
      <span class="hint"></span>
    </label>
    <label class="field">Örnek cümle
      <textarea name="sentence" maxlength="500" rows="3" lang="en" spellcheck="false"></textarea>
    </label>
    <label class="field">Not
      <textarea name="note" maxlength="500" rows="2"></textarea>
    </label>
    <div class="card-tools">
      <button type="button" class="btn btn-ghost" data-action="suspend"></button>
      <button type="button" class="btn btn-ghost" data-action="reset">Baştan öğren</button>
      <button type="button" class="btn btn-ghost danger" data-action="delete">Sil</button>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-ghost" data-close>Vazgeç</button>
      <button class="btn btn-primary" value="save">Kaydet</button>
    </div>
  </form>
</dialog>
</body>
</html>
